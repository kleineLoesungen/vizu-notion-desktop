# Baut die Auslieferungsdateien, sobald ein Tag v* geschoben wird.
#
#   git tag v0.1.0 && git push origin v0.1.0
#
# Ergebnis am Release: Starter.app als ZIP (universal) und ein Linux-Tarball.
# Zum Signieren und Notarisieren siehe docs/RELEASE.md — ohne Geheimnisse im
# Verwaltungssystem bleibt das Bündel ad-hoc signiert und lässt sich nur auf
# dem eigenen Rechner öffnen.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - run: ./scripts/bundle-macos.sh
      # ditto statt zip: nur ditto erhält die Symlinks und erweiterten
      # Attribute eines .app-Bündels.
      - run: ditto -c -k --keepParent dist/Starter.app dist/Starter-macos-universal.zip
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/Starter-macos-universal.zip

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1-mesa-dev libx11-dev libxcursor-dev libxi-dev \
            libxrandr-dev libxkbcommon-dev libwayland-dev
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - run: ./scripts/package-linux.sh
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.tar.gz
