# Derselbe Torwächter wie `just check`, auf beiden Zielsystemen.
#
# Linux braucht die Systembibliotheken, gegen die winit und glow binden.
# macOS braucht nichts weiter — deshalb steht die Liste nur im Linux-Schritt.
name: check

on:
  push:
    branches: [main, master]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15        # Apple Silicon
          - os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      # Ohne diese Pakete scheitert der Bau der Oberfläche unter Linux mit
      # Meldungen über fehlende .so-Dateien, nicht mit einem Rust-Fehler.
      - name: Systembibliotheken (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1-mesa-dev libx11-dev libxcursor-dev libxi-dev \
            libxrandr-dev libxkbcommon-dev libwayland-dev

      # Die Fassung steht in rust-toolchain.toml; rustup liest sie selbst.
      - name: Rust
        run: rustup show

      - uses: Swatinem/rust-cache@v2

      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

      # Die Oberflächentests brauchen keinen Bildschirm: egui_kittest prüft
      # den Barrierefreiheitsbaum, nicht gerenderte Bilder.
      - run: cargo test --workspace

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: EmbarkStudios/cargo-deny-action@v2
