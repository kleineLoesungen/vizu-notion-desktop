<?xml version="1.0" encoding="UTF-8"?>
<!--
  Das eine Symbol, aus dem alle anderen entstehen.

  Bearbeiten und danach  ./scripts/icons.sh  laufen lassen — das erzeugt die
  PNG-Größen und die .icns-Datei neu. Die erzeugten Dateien liegen mit im
  Verwaltungssystem, damit ein Bau unter Linux ohne macOS-Werkzeuge auskommt.

  Die Farbe ist bewusst dieselbe wie die Voreinstellung von `accent` in
  crates/core/src/config.rs.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" rx="114" fill="#3b6ea5"/>
  <g fill="#ffffff">
    <rect x="128" y="112" width="256" height="288" rx="24" opacity="0.95"/>
  </g>
  <g fill="#3b6ea5">
    <rect x="164" y="164" width="184" height="20" rx="10"/>
    <rect x="164" y="216" width="184" height="20" rx="10"/>
    <rect x="164" y="268" width="120" height="20" rx="10"/>
  </g>
</svg>
