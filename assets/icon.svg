<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <title>Vizu Notion</title>
  <!--
    Das Symbol der Anwendung. Quelle für alle Größen:
        just icons        (npx tauri icon assets/icon.svg)

    Gedanke dahinter: Notions Bildsprache ist Papierweiß, schwarze Haarlinien,
    strenge Geometrie. Darauf ein Graph aus vier Knoten — dessen Kanten ein N
    zeichnen. Das Zeichen von Notion selbst wird dabei nicht nachgebaut; es
    gehört ihnen.

    Ein Knoten trägt die Akzentfarbe der Anwendung (#3b6ea5, siehe
    ui/src/theme.css und docs/DESIGN.md).
  -->
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fdfdfc"/>
      <stop offset="1" stop-color="#eeece7"/>
    </linearGradient>
  </defs>

  <!--
    Die abgerundete Fläche. macOS erwartet sie kleiner als die Zeichenfläche:
    824 von 1024 Punkten, mittig. Wer die vollen 1024 nutzt, bekommt ein
    Symbol, das im Dock größer wirkt als alle anderen.
  -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#paper)"/>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="none"
        stroke="#1a1a19" stroke-opacity="0.09" stroke-width="7"/>

  <!-- Die Kanten: links hoch, quer hinunter, rechts hoch. -->
  <g stroke="#1a1a19" stroke-width="31" stroke-linecap="round" fill="none">
    <path d="M368 663 V 391"/>
    <path d="M368 361 L 656 648"/>
    <path d="M656 618 V 346"/>
  </g>

  <!-- Die Knoten. Weiß gefüllt, damit die Kanten darunter enden. -->
  <g stroke="#1a1a19" stroke-width="31">
    <circle cx="368" cy="689" r="42" fill="#fdfdfc"/>
    <circle cx="368" cy="335" r="42" fill="#fdfdfc"/>
    <circle cx="656" cy="675" r="42" fill="#fdfdfc"/>
    <circle cx="656" cy="321" r="42" fill="#3b6ea5"/>
  </g>
</svg>
